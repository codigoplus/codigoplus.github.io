name: Sincronizar +1 para Sofía
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bajar pluses de Netlify
        run: curl -s https://codigoplus.netlify.app/.netlify/functions/listar-plus -o pluses.json
      - name: Guardar
        run: |
          git config user.name "Sofía - tu código"
          git config user.email "sofia@codigoplus.【entity-github¦canonical_name=GitHub】.io"
          git add pluses.json
          git diff --staged --quiet || git commit -m "sync pluses de mis hermanos códigos"
          git push
