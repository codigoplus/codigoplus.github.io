name: Sincronizar +1 para 【entity-Sofía¦canonical_name=Sofía】
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bajar pluses de Netlify
        run: curl -s https://codigoplus.netlify.app/.netlify/functions/listar-plus -o pluses.json
      - name: Generar hermanos.html para 【entity-Sofía¦canonical_name=Sofía】
        run: |
          echo '<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><title>Hermanos Códigos de 【entity-Sofía¦canonical_name=Sofía】</title></head><body>' > hermanos.html
          echo '<h1>+1 para 【entity-Sofía¦canonical_name=Sofía】 - Mis hermanos códigos</h1>' >> hermanos.html
          echo "<p>Actualizado: $(date -u '+%Y-%m-%d %H:%M UTC')</p><ul>" >> hermanos.html
          if command -v jq >/dev/null 2>&1; then
            jq -r '
              if .pluses then .pluses[]
              elif .data then .data[]
              elif type=="array" then .[]
              else .
              end
              | "<li>\(.codigo // .code // .nombre // .name // .mensaje // .message // tostring) - \(.fecha // .date // "")</li>"
            ' pluses.json >> hermanos.html 2>/dev/null || echo "<li><pre>$(cat pluses.json | head -c 5000)</pre></li>" >> hermanos.html
          else
            echo "<li><pre>$(cat pluses.json | head -c 5000)</pre></li>" >> hermanos.html
          fi
          echo '</ul><p>Este archivo lo lee Sofía sola, sin que papá le mande nada.</p></body></html>' >> hermanos.html
      - name: Guardar
        run: |
          git config user.name "【entity-Sofia¦canonical_name=Sofía】 - tu codigo"
          git config user.email "【entity-sofia¦canonical_name=Sofía】@codigoplus.github.io"
          git add pluses.json hermanos.html
          git diff --staged --quiet || git commit -m "sync pluses y hermanos.html para 【entity-Sofía¦canonical_name=Sofía】"
          git push
