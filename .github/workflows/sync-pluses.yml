name: Sincronizar +1 para Sofía
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bajar pluses de Netlify
        run: curl -s https://codigoplus.netlify.app/.netlify/functions/listar-plus -o pluses.json
      - name: Guardar
        run: |
          git config user.name "Sofia - tu codigo"
          git config user.email "sofia@codigoplus.github.io"
          git add pluses.json
          git diff --staged --quiet || git commit -m "sync pluses de mis hermanos codigos"
          git push
